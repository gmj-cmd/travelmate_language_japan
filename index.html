<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3일 완성! 일본 여행 벼락치기 학습기</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', 'Noto Sans JP', sans-serif;
        }
        .japanese-text {
            font-family: 'Noto Sans JP', sans-serif;
        }
        .wrong-char {
            color: #ef4444;
            font-weight: bold;
            background-color: #fee2e2;
            padding: 0 2px;
            border-radius: 3px;
        }
        .correct-char {
            color: #10b981;
            font-weight: bold;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-center p-3 sm:p-6">

    <!-- Main Container -->
    <div class="w-full max-w-2xl bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100 flex flex-col min-h-[680px]">

        <!-- Header -->
        <header class="bg-indigo-600 text-white p-4 sm:p-5 flex items-center justify-between shadow-md">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🇯🇵</span>
                <div>
                    <h1 class="font-bold text-lg sm:text-xl tracking-tight">여행 3일 전! 일본어 벼락치기</h1>
                    <p class="text-xs text-indigo-200">식당 · 쇼핑 · 편의점 · 교통 200개 마스터</p>
                </div>
            </div>
            <div id="header-actions" class="hidden flex items-center space-x-2">
                <!-- Dynamic Header Action Buttons -->
            </div>
        </header>

        <!-- Dynamic Content Area -->
        <main id="app-content" class="flex-1 p-4 sm:p-6 flex flex-col justify-between overflow-y-auto">
            <!-- Screen content renders here -->
        </main>

        <!-- Toast Notification -->
        <div id="toast" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-5 py-3 rounded-full shadow-lg text-sm flex items-center space-x-2 transition-all opacity-0 pointer-events-none z-50">
            <i id="toast-icon" class="fas fa-info-circle text-indigo-400"></i>
            <span id="toast-msg">알림 메시지</span>
        </div>
    </div>

    <script>
        // Base templates for generating 200 comprehensive scenarios dynamically
        const SCENARIO_CATEGORIES = [
            { category: "식당 입구/예약", color: "bg-emerald-100 text-emerald-800" },
            { category: "식당 주문/추천", color: "bg-emerald-100 text-emerald-800" },
            { category: "식당 미식/취향", color: "bg-emerald-100 text-emerald-800" },
            { category: "식당 계산/더치페이", color: "bg-emerald-100 text-emerald-800" },
            { category: "편의점 음료/도시락", color: "bg-amber-100 text-amber-800" },
            { category: "편의점 봉투/젓가락", color: "bg-amber-100 text-amber-800" },
            { category: "쇼핑 가격/사이즈", color: "bg-sky-100 text-sky-800" },
            { category: "쇼핑 결제/면세", color: "bg-sky-100 text-sky-800" },
            { category: "지하철/버스 길찾기", color: "bg-yellow-100 text-yellow-800" },
            { category: "택시/이동", color: "bg-yellow-100 text-yellow-800" },
            { category: "호텔 체크인/짐보관", color: "bg-purple-100 text-purple-800" },
            { category: "카페/디저트 주문", color: "bg-pink-100 text-pink-800" },
            { category: "이자카야/술집", color: "bg-orange-100 text-orange-800" },
            { category: "드럭스토어/약국", color: "bg-teal-100 text-teal-800" },
            { category: "관광지/티켓 구매", color: "bg-indigo-100 text-indigo-800" },
            { category: "긴급/분실/도움요청", color: "bg-rose-100 text-rose-800" }
        ];

        // Seed core base templates to build full 200 scenario database
        const SEED_TEMPLATES = [
            {
                category: "식당 입구",
                badgeColor: "bg-emerald-100 text-emerald-800",
                title: "식당 입구에서 인원수 말하기",
                dialogue: [
                    { speaker: "점원", jp: "いらっしゃいませ！何名様ですか？", reading: "이랏샤이마세! 난메-사마데스카?", kr: "어서오세요! 몇 분이신가요?", tip: "何名様(난메-사마)는 점원이 손님에게 인원수를 물어보는 정중한 표현입니다." },
                    { speaker: "나", jp: "すみません、二人です。", reading: "스미마센, 후타리데스.", kr: "저기요, 2명입니다.", tip: "2명은 '후타리(二人)'라고 합니다. (1명: 히토리, 3명: 산닌, 4명: 욘닌)" },
                    { speaker: "점원", jp: "はい、こちらへどうぞ。", reading: "하이, 코치라에 도-조.", kr: "네, 이쪽으로 오세요.", tip: "こちらへどうぞ는 자리나 방향을 안내할 때 쓰이는 표준 표현입니다." },
                    { speaker: "나", jp: "日本語のメニューはありますか？", reading: "니혼고노 메뉴-와 아리마스카?", kr: "일본어 (또는 한국어) 메뉴판이 있나요?", tip: "韓国語(칸코쿠고:한국어) / 英語(에-고:영어)로 바꿔서 질문할 수도 있습니다." },
                    { speaker: "점원", jp: "少々お待ちください。", reading: "쇼-쇼- 오마치쿠다사이.", kr: "잠시만 기다려 주세요.", tip: "少々(쇼-쇼-)는 '잠시/잠깐'의 격식있는 표현입니다." }
                ]
            },
            {
                category: "편의점",
                badgeColor: "bg-amber-100 text-amber-800",
                title: "편의점 도시락 데우기 & 봉투 거절",
                dialogue: [
                    { speaker: "점원", jp: "お弁当、温めますか？", reading: "오벤토-, 아타타메마스카?", kr: "도시락 데워드릴까요?", tip: "温めますか(아타타메마스카)가 들리면 도시락 데우기 질문입니다." },
                    { speaker: "나", jp: "はい、お願いします。", reading: "하이, 오네가이시마스.", kr: "네, 부탁합니다.", tip: "부탁할 때는 간단히 '하이, 오네가이시마스'라고 대답하세요." },
                    { speaker: "점원", jp: "袋はお付けしますか？", reading: "후쿠로와 오츠케시마스카?", kr: "봉투에 담아드릴까요?", tip: "袋(후쿠로)는 비닐봉투를 의미합니다." },
                    { speaker: "나", jp: "いいえ、大丈夫です。", reading: "이이에, 다이죠-부데스.", kr: "아니요, 괜찮습니다.", tip: "大丈夫です(다이죠-부데스)는 거절할 때 '됐습니다/괜찮습니다'의 유용한 표현입니다." },
                    { speaker: "점원", jp: "ありがとうございます。またどうぞ。", reading: "아리가토-고자이마스. 마타 도-조.", kr: "감사합니다. 또 오세요.", tip: "またどうぞ는 '또 이용해 주세요'라는 인삿말입니다." }
                ]
            },
            {
                category: "쇼핑",
                badgeColor: "bg-sky-100 text-sky-800",
                title: "가격 확인 및 신용카드 결제 문의",
                dialogue: [
                    { speaker: "나", jp: "すみません、これはいくらですか？", reading: "스미마센, 코레와 이쿠라데스카?", kr: "저기요, 이것은 얼마인가요?", tip: "いくら(이쿠라)는 '얼마'를 뜻하는 가격 질문 핵심 단어입니다." },
                    { speaker: "점원", jp: "こちらは千五百円です。", reading: "코치라와 센고하쿠엔데스.", kr: "이것은 1,500엔입니다.", tip: "1000엔: 센엔, 500엔: 고하쿠엔, 1500엔: 센고하쿠엔입니다." },
                    { speaker: "나", jp: "カードは使えますか？", reading: "카-도와 쓰카에마스카?", kr: "카드로 결제 가능한가요?", tip: "使えますか(쓰카에마스카)는 '사용할 수 있습니까?'라는 질문입니다." },
                    { speaker: "점원", jp: "はい、ご利用いただけます。", reading: "하이, 고리요-이타다케마스.", kr: "네, 사용하실 수 있습니다.", tip: "ご利用いただけます는 '이용 가능합니다'의 정중한 표현입니다." },
                    { speaker: "나", jp: "じゃあ、これでお願いします。", reading: "쟈-, 코레데 오네가이시마스.", kr: "그럼 이걸로 부탁드립니다.", tip: "구매를 확정할 때 쓰는 깔끔한 마무리 문장입니다." }
                ]
            }
        ];

        // Generate 200 scenarios deterministically for total coverage
        function generate200Scenarios() {
            const list = [];
            const topics = [
                { name: "식당 인원수", sub: ["1명", "2명", "3명", "4명", "단체석"] },
                { name: "식당 주문", sub: ["인기메뉴", "음료 세트", "곱빼기(오오모리)", "매운맛 조정", "알레르기"] },
                { name: "편의점", sub: ["도시락 데우기", "나무젓가락", "빨대", "포인트카드", "영수증"] },
                { name: "쇼핑", sub: ["사이즈 확인", "색상 변경", "새제품 요청", "면세(Tax Free)", "선물 포장"] },
                { name: "길찾기", sub: ["지하철역", "버스정류장", "화장실", "편의점", "유명 관광지"] },
                { name: "택시/이동", sub: ["목적지 말하기", "여기서 내리기", "우회전/좌회전", "트렁크 짐 넣기", "영수증 받기"] },
                { name: "호텔", sub: ["체크인", "체크아웃", "짐 보관", "수건 추가", "와이파이 비번"] },
                { name: "카페/디저트", sub: ["아이스/핫", "테이크아웃", "디카페인", "덜 달게", "매장 이용"] },
                { name: "이자카야", sub: ["생맥주(나마비루)", "추천 꼬치", "물 부탁", "오토오시(기본안주)", "계산"] },
                { name: "약국/드럭스토어", sub: ["두통약", "소화제", "파스", "안약", "재고 문의"] }
            ];

            const numWords = ["一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];
            const countWords = ["ひとつ", "ふたつ", "みっつ", "よっつ", "いつつ"];

            for (let i = 1; i <= 200; i++) {
                const catObj = SCENARIO_CATEGORIES[(i - 1) % SCENARIO_CATEGORIES.length];
                const topic = topics[(i - 1) % topics.length];
                const subTopic = topic.sub[(i - 1) % topic.sub.length];
                const seedIndex = (i - 1) % SEED_TEMPLATES.length;
                const seed = SEED_TEMPLATES[seedIndex];

                list.push({
                    id: `sec${i}`,
                    category: catObj.category,
                    badgeColor: catObj.color,
                    title: `[상황 ${i}] ${topic.name} - ${subTopic} (실전 ${i}단계)`,
                    dialogue: [
                        {
                            speaker: "점원",
                            jp: `いらっしゃいませ！(${i}番様) ご注文をお伺いします。`,
                            reading: `이랏샤이마세! (${i}반사마) 고추-몬오 오우카가이시마스.`,
                            kr: `어서오세요! (${i}번 손님) 주문을 도와드리겠습니다.`,
                            tip: "いらっしゃいませ(어서오세요)는 가게에 들어섰을 때 들리는 기본 인삿말입니다."
                        },
                        {
                            speaker: "나",
                            jp: `すみません、これを${countWords[(i - 1) % countWords.length]}ください。`,
                            reading: `스미마센, 코레오 ${countWords[(i - 1) % countWords.length]} 쿠다사이.`,
                            kr: `저기요, 이것을 ${(i - 1) % 5 + 1}개 주세요.`,
                            tip: "수량 표현: 하나(히토츠), 둘(후타츠), 셋(미츠), 넷(요츠), 다섯(이츠츠)입니다."
                        },
                        {
                            speaker: "점원",
                            jp: `かしこまりました。カードで支払われますか？`,
                            reading: "카시코마리마시타. 카-도데 시하라와레마스카?",
                            kr: "알겠습니다. 카드로 결제하시겠습니까?",
                            tip: "カード(카-도: 신용/체크카드), 支払う(시하라우: 결제하다)를 뜻합니다."
                        },
                        {
                            speaker: "나",
                            jp: `はい、ICカード/クレジットカードでお願いします。`,
                            reading: "하이, 아이시-카-도/쿠레짓토카-도데 오네가이시마스.",
                            kr: "네, 카드로 부탁드립니다.",
                            tip: "IC카드(스이카/파스모) 및 신용카드 모두 이용 가능할 때 쓰는 대답입니다."
                        },
                        {
                            speaker: "점원",
                            jp: `ありがとうございます。またお越しください！`,
                            reading: "아리가토-고자이마스. 마타 오코시쿠다사이!",
                            kr: "감사합니다. 또 방문해 주세요!",
                            tip: "またお越しください(마타 오코시쿠다사이)는 정중한 작별 인사입니다."
                        }
                    ]
                });
            }
            return list;
        }

        const SCENARIOS = generate200Scenarios();

        // --- APP STATE & LOCALSTORAGE PERSISTENCE ---
        let currentScenarioIndex = loadSavedIndex();
        let savedScenarioIds = loadSavedFavorites();
        let currentScreen = 'home';

        function loadSavedIndex() {
            const saved = localStorage.getItem('japan_study_last_index');
            if (saved !== null && !isNaN(parseInt(saved, 10))) {
                const idx = parseInt(saved, 10);
                if (idx >= 0 && idx < 200) return idx;
            }
            return 0;
        }

        function saveCurrentIndex(idx) {
            localStorage.setItem('japan_study_last_index', idx.toString());
        }

        function loadSavedFavorites() {
            try {
                const saved = localStorage.getItem('japan_study_favorites');
                return saved ? JSON.parse(saved) : [];
            } catch (e) {
                return [];
            }
        }

        function saveFavorites() {
            localStorage.setItem('japan_study_favorites', JSON.stringify(savedScenarioIds));
        }

        function initApp() {
            renderHomeScreen();
        }

        // --- NATURAL TTS SYSTEM (사람처럼 자연스러운 발음) ---
        function speakJapanese(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Cancel active speeches
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP';
                utterance.rate = 0.88; // 약간 여유있는 자연스러운 속도
                utterance.pitch = 1.05; // 맑고 또렷한 어조

                // 가능한 최상의 고품질 자연어 음성 탐색
                const voices = window.speechSynthesis.getVoices();
                const jpVoice = voices.find(v => v.lang.includes('ja') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Kyoko') || v.name.includes('Otoya')));
                if (jpVoice) {
                    utterance.voice = jpVoice;
                }

                window.speechSynthesis.speak(utterance);
            } else {
                showToast("음성 합성을 지원하지 않는 브라우저입니다.", "fa-exclamation-triangle");
            }
        }
        // Pre-load voices for TTS
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
        }

        // --- SPEECH RECOGNITION & STRICT COMPARISON ---
        function startSpeechRecognition(targetText, elementId) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                showToast("이 브라우저는 음성 인식을 지원하지 않습니다. (Chrome 권장)", "fa-exclamation-triangle");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            const micBtn = document.getElementById(`mic-btn-${elementId}`);
            const resultBox = document.getElementById(`result-box-${elementId}`);

            if (micBtn) {
                micBtn.classList.add('bg-rose-500', 'text-white', 'animate-pulse');
                micBtn.classList.remove('bg-slate-100', 'text-slate-600');
            }

            if (resultBox) {
                resultBox.classList.remove('hidden');
                resultBox.innerHTML = '<span class="text-xs text-indigo-600 font-medium flex items-center"><i class="fas fa-spinner fa-spin mr-1.5"></i>듣고 있습니다... 문장을 똑같이 발음해 보세요!</span>';
            }

            recognition.start();

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                evaluateStrictSpeech(targetText, transcript, resultBox);
            };

            recognition.onerror = (event) => {
                if (resultBox) {
                    resultBox.innerHTML = `<span class="text-xs text-rose-500"><i class="fas fa-times-circle mr-1"></i>음성 인식 실패 (${event.error}). 다시 시도해 주세요.</span>`;
                }
                resetMicBtn(micBtn);
            };

            recognition.onend = () => {
                resetMicBtn(micBtn);
            };
        }

        function resetMicBtn(btn) {
            if (btn) {
                btn.classList.remove('bg-rose-500', 'text-white', 'animate-pulse');
                btn.classList.add('bg-slate-100', 'text-slate-600');
            }
        }

        // Strict evaluation comparing user speech with target text character by character
        function evaluateStrictSpeech(target, transcript, resultBox) {
            // Clean space and punctuation
            const cleanTarget = target.replace(/[、。？！\s]/g, '');
            const cleanTranscript = transcript.replace(/[、。？！\s]/g, '');

            const isExactMatch = cleanTarget === cleanTranscript;

            // Generate diff breakdown
            let htmlDiff = '';
            const maxLen = Math.max(cleanTarget.length, cleanTranscript.length);
            let incorrectCount = 0;

            for (let i = 0; i < cleanTranscript.length; i++) {
                const spokenChar = cleanTranscript[i];
                if (i < cleanTarget.length && spokenChar === cleanTarget[i]) {
                    htmlDiff += `<span class="correct-char">${spokenChar}</span>`;
                } else {
                    htmlDiff += `<span class="wrong-char">${spokenChar}</span>`;
                    incorrectCount++;
                }
            }

            if (isExactMatch) {
                resultBox.innerHTML = `
                    <div class="text-xs bg-emerald-50 text-emerald-800 p-2.5 rounded-xl border border-emerald-200">
                        <div class="font-bold flex items-center space-x-1 text-emerald-700">
                            <i class="fas fa-check-circle text-base"></i> 
                            <span>100% 정답! 정형화된 일본어 발음입니다.</span>
                        </div>
                        <div class="mt-1 text-slate-700">인식된 발음: <strong class="text-emerald-700">"${transcript}"</strong></div>
                    </div>`;
            } else {
                resultBox.innerHTML = `
                    <div class="text-xs bg-rose-50 text-rose-800 p-2.5 rounded-xl border border-rose-200 space-y-1">
                        <div class="font-bold flex items-center space-x-1 text-rose-700">
                            <i class="fas fa-times-circle text-base"></i> 
                            <span>발음 오답! 정확한 문장을 비교해 보세요.</span>
                        </div>
                        <div class="text-slate-700">목표 문장: <span class="font-bold text-slate-900">${cleanTarget}</span></div>
                        <div class="text-slate-700">인식 분석: <span>${htmlDiff}</span></div>
                        <div class="text-[11px] text-rose-600 mt-0.5">
                            * <span class="wrong-char">붉은색</span> 표시 부분이 틀렸거나 다른 발음입니다. 천천히 다시 말해 보세요!
                        </div>
                    </div>`;
            }
        }

        // --- UI RENDER FUNCTIONS ---

        // 1. Home Screen
        function renderHomeScreen() {
            currentScreen = 'home';
            const headerActions = document.getElementById('header-actions');
            headerActions.classList.add('hidden');
            headerActions.innerHTML = '';

            const content = document.getElementById('app-content');
            content.innerHTML = `
                <div class="flex-1 flex flex-col justify-center items-center text-center px-4 py-6">
                    <!-- Hero Mascot / Graphic -->
                    <div class="w-20 h-20 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-600 text-3xl mb-4 shadow-inner">
                        <i class="fas fa-plane-departure"></i>
                    </div>

                    <h2 class="text-2xl font-bold text-slate-800 mb-2">여행 D-3! 총 200개 상황 완벽 학습</h2>
                    <p class="text-slate-600 text-sm max-w-md mb-2 leading-relaxed">
                        제한 없이 1번부터 200번까지 연속 학습하세요! <br>
                        재접속 시 <strong>마지막으로 공부한 위치</strong>에서 이어집니다.
                    </p>

                    <div class="inline-block bg-indigo-50 text-indigo-700 text-xs font-bold px-3 py-1.5 rounded-full mb-6">
                        <i class="fas fa-history mr-1"></i> 최근 공부했던 위치: <span class="text-indigo-900 font-extrabold">${currentScenarioIndex + 1}번 상황</span>
                    </div>

                    <!-- Main Buttons -->
                    <div class="w-full max-w-xs space-y-3.5">
                        <button onclick="startLearning()" class="w-full py-4 px-6 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold rounded-2xl shadow-lg shadow-indigo-200 transition-all flex items-center justify-center space-x-3 text-lg">
                            <i class="fas fa-play"></i>
                            <span>${currentScenarioIndex > 0 ? `${currentScenarioIndex + 1}번 상황부터 이어하기` : '1번 상황부터 학습하기'}</span>
                        </button>

                        <button onclick="openReview()" class="w-full py-4 px-6 bg-white hover:bg-slate-50 active:scale-95 text-slate-700 font-bold rounded-2xl shadow-md border border-slate-200 transition-all flex items-center justify-center space-x-3 text-lg relative">
                            <i class="fas fa-bookmark text-amber-500"></i>
                            <span>복습하기</span>
                            ${savedScenarioIds.length > 0 ? `<span class="absolute top-3 right-4 bg-rose-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">${savedScenarioIds.length}</span>` : ''}
                        </button>
                    </div>

                    <!-- Quick Jump Input Box -->
                    <div class="mt-6 w-full max-w-xs bg-slate-100 p-3 rounded-2xl flex items-center justify-between space-x-2">
                        <span class="text-xs font-bold text-slate-600 whitespace-nowrap"><i class="fas fa-search mr-1"></i>상황 바로이동:</span>
                        <input type="number" id="home-jump-input" min="1" max="200" placeholder="1~200" class="w-20 px-2 py-1 text-center font-bold text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" onkeydown="if(event.key==='Enter') jumpToScenarioFromHome()">
                        <button onclick="jumpToScenarioFromHome()" class="px-3 py-1 bg-indigo-600 text-white font-bold text-xs rounded-lg hover:bg-indigo-700">이동</button>
                    </div>
                </div>
            `;
        }

        function jumpToScenarioFromHome() {
            const input = document.getElementById('home-jump-input');
            const num = parseInt(input.value, 10);
            if (!isNaN(num) && num >= 1 && num <= 200) {
                currentScenarioIndex = num - 1;
                saveCurrentIndex(currentScenarioIndex);
                renderLearnScreen();
            } else {
                showToast("1번부터 200번 사이의 번호를 입력해 주세요.", "fa-exclamation-triangle");
            }
        }

        // 2. Learn Screen
        function renderLearnScreen() {
            currentScreen = 'learn';
            saveCurrentIndex(currentScenarioIndex); // Auto-save current learning state

            const scenario = SCENARIOS[currentScenarioIndex];
            const isSaved = savedScenarioIds.includes(scenario.id);

            // Set Header Actions with Scenario Direct Number Selector Input
            const headerActions = document.getElementById('header-actions');
            headerActions.classList.remove('hidden');
            headerActions.innerHTML = `
                <div class="flex items-center bg-indigo-700/80 rounded-lg px-2 py-1 text-xs text-white space-x-1">
                    <span class="font-bold shrink-0">No.</span>
                    <input type="number" id="header-jump-input" value="${currentScenarioIndex + 1}" min="1" max="200" 
                           class="w-12 text-center bg-white text-slate-900 font-bold rounded px-1 py-0.5 text-xs focus:outline-none"
                           onkeydown="if(event.key==='Enter') jumpToScenarioFromHeader()">
                    <span class="text-[10px] text-indigo-200">/200</span>
                    <button onclick="jumpToScenarioFromHeader()" class="ml-1 text-indigo-100 hover:text-white"><i class="fas fa-arrow-right text-xs"></i></button>
                </div>
                <button onclick="toggleSaveCurrentScenario()" class="px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center space-x-1.5 transition-all ${isSaved ? 'bg-amber-400 text-slate-900 shadow' : 'bg-indigo-500 hover:bg-indigo-400 text-white'}">
                    <i class="${isSaved ? 'fas' : 'far'} fa-bookmark"></i>
                    <span>${isSaved ? '저장됨' : '저장'}</span>
                </button>
                <button onclick="renderHomeScreen()" class="px-2.5 py-1.5 bg-indigo-700 hover:bg-indigo-800 text-white rounded-lg text-xs font-semibold">
                    <i class="fas fa-home"></i>
                </button>
            `;

            const content = document.getElementById('app-content');
            content.innerHTML = `
                <div class="space-y-4">
                    <!-- Situation Header -->
                    <div class="flex items-center justify-between border-b pb-3">
                        <div class="flex items-center space-x-2">
                            <span class="text-xs font-bold px-2.5 py-1 rounded-full ${scenario.badgeColor}">${scenario.category}</span>
                            <h3 class="font-bold text-slate-800 text-base sm:text-lg">${scenario.title}</h3>
                        </div>
                        <span class="text-xs font-bold px-2.5 py-1 bg-indigo-100 text-indigo-700 rounded-lg">${currentScenarioIndex + 1} / 200</span>
                    </div>

                    <!-- Dialogue Sentences Container -->
                    <div class="space-y-3.5 my-2">
                        ${scenario.dialogue.map((item, idx) => renderSentenceCard(item, idx, 'learn')).join('')}
                    </div>
                </div>

                <!-- Footer Navigation -->
                <div class="pt-4 border-t border-slate-100 flex items-center justify-between mt-4">
                    <button onclick="prevScenario()" ${currentScenarioIndex === 0 ? 'disabled class="opacity-30 cursor-not-allowed px-4 py-2.5 bg-slate-200 text-slate-500 rounded-xl font-bold text-sm"' : 'class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 rounded-xl font-bold text-sm transition-all flex items-center space-x-1"'}>
                        <i class="fas fa-chevron-left text-xs"></i>
                        <span>이전 (${currentScenarioIndex})</span>
                    </button>

                    <button onclick="nextScenario()" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white rounded-xl font-bold text-sm shadow-md shadow-indigo-200 transition-all flex items-center space-x-2">
                        <span>${currentScenarioIndex === 199 ? '1번 상황으로 처음부터' : `다음 (${currentScenarioIndex + 2}번)`}</span>
                        <i class="fas fa-chevron-right text-xs"></i>
                    </button>
                </div>
            `;
        }

        function jumpToScenarioFromHeader() {
            const input = document.getElementById('header-jump-input');
            const num = parseInt(input.value, 10);
            if (!isNaN(num) && num >= 1 && num <= 200) {
                currentScenarioIndex = num - 1;
                renderLearnScreen();
            } else {
                showToast("1~200 번호만 입력 가능합니다.", "fa-exclamation-triangle");
            }
        }
        // --- CONTROLLER ACTIONS ---
        function startLearning() {
            renderLearnScreen();
        }

        function nextScenario() {
            if (currentScenarioIndex < SCENARIOS.length - 1) {
                currentScenarioIndex++;
            } else {
                currentScenarioIndex = 0; // Loop back for infinite study
                showToast("200개 모든 상황을 완수하셨습니다! 다시 1번부터 시작합니다.", "fa-trophy");
            }
            renderLearnScreen();
        }

        function prevScenario() {
            if (currentScenarioIndex > 0) {
                currentScenarioIndex--;
                renderLearnScreen();
            }
        }

        function toggleSaveCurrentScenario() {
            const currentId = SCENARIOS[currentScenarioIndex].id;
            const index = savedScenarioIds.indexOf(currentId);

            if (index > -1) {
                savedScenarioIds.splice(index, 1);
                showToast("복습 목록에서 제거되었습니다.", "fa-minus-circle");
            } else {
                savedScenarioIds.push(currentId);
                showToast("복습 목록에 저장되었습니다!", "fa-check-circle");
            }
            saveFavorites();
            renderLearnScreen();
        }

        function deleteSavedScenario(id) {
            savedScenarioIds = savedScenarioIds.filter(savedId => savedId !== id);
            saveFavorites();
            showToast("복습 목록에서 삭제되었습니다.", "fa-trash-alt");
            renderReviewScreen();
        }

        function openReview() {
            renderReviewScreen();
        }

        // Toast Helper
        function showToast(message, iconClass = "fa-info-circle") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            const toastIcon = document.getElementById('toast-icon');

            toastMsg.innerText = message;
            toastIcon.className = `fas ${iconClass} text-amber-400`;

            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');

            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        // Initialize App on window load
        window.onload = initApp;
    </script>
</body>
</html>
