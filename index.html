        }

        // --- NATURAL TTS SYSTEM (사람처럼 자연스러운 발음) ---
        function speakJapanese(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Cancel active speeches
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP';
                utterance.rate = 0.88; // 약간 여유있는 자연스러운 속도
                utterance.pitch = 1.05; // 맑고 또렷한 어조

                // 가능한 최상의 고품질 자연어 음성 탐색
                const voices = window.speechSynthesis.getVoices();
                const jpVoice = voices.find(v => v.lang.includes('ja') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Kyoko') || v.name.includes('Otoya')));
                if (jpVoice) {
                    utterance.voice = jpVoice;
                }

                window.speechSynthesis.speak(utterance);
            } else {
                showToast("음성 합성을 지원하지 않는 브라우저입니다.", "fa-exclamation-triangle");
            }
        }
        // Pre-load voices for TTS
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
        }

        // --- SPEECH RECOGNITION & STRICT COMPARISON ---
        function startSpeechRecognition(targetText, elementId) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                showToast("이 브라우저는 음성 인식을 지원하지 않습니다. (Chrome 권장)", "fa-exclamation-triangle");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            const micBtn = document.getElementById(`mic-btn-${elementId}`);
            const resultBox = document.getElementById(`result-box-${elementId}`);

            if (micBtn) {
                micBtn.classList.add('bg-rose-500', 'text-white', 'animate-pulse');
                micBtn.classList.remove('bg-slate-100', 'text-slate-600');
            }

            if (resultBox) {
                resultBox.classList.remove('hidden');
                resultBox.innerHTML = '<span class="text-xs text-indigo-600 font-medium flex items-center"><i class="fas fa-spinner fa-spin mr-1.5"></i>듣고 있습니다... 문장을 똑같이 발음해 보세요!</span>';
            }

            recognition.start();

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                evaluateStrictSpeech(targetText, transcript, resultBox);
            };

            recognition.onerror = (event) => {
                if (resultBox) {
                    resultBox.innerHTML = `<span class="text-xs text-rose-500"><i class="fas fa-times-circle mr-1"></i>음성 인식 실패 (${event.error}). 다시 시도해 주세요.</span>`;
                }
                resetMicBtn(micBtn);
            };

            recognition.onend = () => {
                resetMicBtn(micBtn);
            };
        }

        function resetMicBtn(btn) {
            if (btn) {
                btn.classList.remove('bg-rose-500', 'text-white', 'animate-pulse');
                btn.classList.add('bg-slate-100', 'text-slate-600');
            }
        }

        // Strict evaluation comparing user speech with target text character by character
        function evaluateStrictSpeech(target, transcript, resultBox) {
            // Clean space and punctuation
            const cleanTarget = target.replace(/[、。？！\s]/g, '');
            const cleanTranscript = transcript.replace(/[、。？！\s]/g, '');

            const isExactMatch = cleanTarget === cleanTranscript;

            // Generate diff breakdown
            let htmlDiff = '';
            const maxLen = Math.max(cleanTarget.length, cleanTranscript.length);
            let incorrectCount = 0;

            for (let i = 0; i < cleanTranscript.length; i++) {
                const spokenChar = cleanTranscript[i];
                if (i < cleanTarget.length && spokenChar === cleanTarget[i]) {
                    htmlDiff += `<span class="correct-char">${spokenChar}</span>`;
                } else {
                    htmlDiff += `<span class="wrong-char">${spokenChar}</span>`;
                    incorrectCount++;
                }
            }

            if (isExactMatch) {
                resultBox.innerHTML = `
                    <div class="text-xs bg-emerald-50 text-emerald-800 p-2.5 rounded-xl border border-emerald-200">
                        <div class="font-bold flex items-center space-x-1 text-emerald-700">
                            <i class="fas fa-check-circle text-base"></i> 
                            <span>100% 정답! 정형화된 일본어 발음입니다.</span>
                        </div>
                        <div class="mt-1 text-slate-700">인식된 발음: <strong class="text-emerald-700">"${transcript}"</strong></div>
                    </div>`;
            } else {
                resultBox.innerHTML = `
                    <div class="text-xs bg-rose-50 text-rose-800 p-2.5 rounded-xl border border-rose-200 space-y-1">
                        <div class="font-bold flex items-center space-x-1 text-rose-700">
                            <i class="fas fa-times-circle text-base"></i> 
                            <span>발음 오답! 정확한 문장을 비교해 보세요.</span>
                        </div>
                        <div class="text-slate-700">목표 문장: <span class="font-bold text-slate-900">${cleanTarget}</span></div>
                        <div class="text-slate-700">인식 분석: <span>${htmlDiff}</span></div>
                        <div class="text-[11px] text-rose-600 mt-0.5">
                            * <span class="wrong-char">붉은색</span> 표시 부분이 틀렸거나 다른 발음입니다. 천천히 다시 말해 보세요!
                        </div>
                    </div>`;
            }
        }

        // --- UI RENDER FUNCTIONS ---

        // 1. Home Screen
        function renderHomeScreen() {
            currentScreen = 'home';
            const headerActions = document.getElementById('header-actions');
            headerActions.classList.add('hidden');
            headerActions.innerHTML = '';

            const content = document.getElementById('app-content');
            content.innerHTML = `
                <div class="flex-1 flex flex-col justify-center items-center text-center px-4 py-6">
                    <!-- Hero Mascot / Graphic -->
                    <div class="w-20 h-20 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-600 text-3xl mb-4 shadow-inner">
                        <i class="fas fa-plane-departure"></i>
                    </div>

                    <h2 class="text-2xl font-bold text-slate-800 mb-2">여행 출발 D-3! 하루 20개 무한 벼락치기</h2>
                    <p class="text-slate-600 text-sm max-w-md mb-6 leading-relaxed">
                        식당, 편의점, 쇼핑, 길묻기, 교통, 긴급상황까지 총 20개 필수 상황 대화를 무한 릴레이로 연습하세요!
                    </p>

                    <!-- Main Buttons -->
                    <div class="w-full max-w-xs space-y-3.5">
                        <button onclick="startLearning()" class="w-full py-4 px-6 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold rounded-2xl shadow-lg shadow-indigo-200 transition-all flex items-center justify-center space-x-3 text-lg">
                            <i class="fas fa-book-open"></i>
                            <span>무한 학습 시작하기 (총 ${SCENARIOS.length}개)</span>
                        </button>

                        <button onclick="openReview()" class="w-full py-4 px-6 bg-white hover:bg-slate-50 active:scale-95 text-slate-700 font-bold rounded-2xl shadow-md border border-slate-200 transition-all flex items-center justify-center space-x-3 text-lg relative">
                            <i class="fas fa-bookmark text-amber-500"></i>
                            <span>복습하기</span>
                            ${savedScenarioIds.length > 0 ? `<span class="absolute top-3 right-4 bg-rose-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">${savedScenarioIds.length}</span>` : ''}
                        </button>
                    </div>

                    <!-- Quick Tip Badge -->
                    <div class="mt-8 p-3 bg-slate-100 rounded-xl text-xs text-slate-600 max-w-sm flex items-start space-x-2 text-left">
                        <i class="fas fa-lightbulb text-amber-500 text-base shrink-0 mt-0.5"></i>
                        <span>문장을 누르면 사람에 가까운 <strong>자연스러운 일본어 음성</strong>이 켜지고, 마이크로 <strong>100% 오답 판정 및 발음 교정</strong>을 받으실 수 있습니다.</span>
                    </div>
                </div>
            `;
        }

        // 2. Learn Screen
        function renderLearnScreen() {
            currentScreen = 'learn';
            const scenario = SCENARIOS[currentScenarioIndex];
            const isSaved = savedScenarioIds.includes(scenario.id);

            // Set Header Actions
            const headerActions = document.getElementById('header-actions');
            headerActions.classList.remove('hidden');
            headerActions.innerHTML = `
                <button onclick="toggleSaveCurrentScenario()" class="px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center space-x-1.5 transition-all ${isSaved ? 'bg-amber-400 text-slate-900 shadow' : 'bg-indigo-500 hover:bg-indigo-400 text-white'}">
                    <i class="${isSaved ? 'fas' : 'far'} fa-bookmark"></i>
                    <span>${isSaved ? '저장됨' : '저장'}</span>
                </button>
                <button onclick="renderHomeScreen()" class="px-2.5 py-1.5 bg-indigo-700 hover:bg-indigo-800 text-white rounded-lg text-xs font-semibold">
                    <i class="fas fa-home"></i>
                </button>
            `;

            const content = document.getElementById('app-content');
            content.innerHTML = `
                <div class="space-y-4">
                    <!-- Situation Header -->
                    <div class="flex items-center justify-between border-b pb-3">
                        <div class="flex items-center space-x-2">
                            <span class="text-xs font-bold px-2.5 py-1 rounded-full ${scenario.badgeColor}">${scenario.category}</span>
                            <h3 class="font-bold text-slate-800 text-base sm:text-lg">${scenario.title}</h3>
                        </div>
                        <span class="text-xs font-bold px-2 py-0.5 bg-indigo-100 text-indigo-700 rounded-md">${currentScenarioIndex + 1} / ${SCENARIOS.length}</span>
                    </div>

                    <!-- Dialogue Sentences Container -->
                    <div class="space-y-3.5 my-2">
                        ${scenario.dialogue.map((item, idx) => renderSentenceCard(item, idx, 'learn')).join('')}
                    </div>
                </div>

                <!-- Footer Navigation (Seamless Infinite Loop / Next Scenario) -->
                <div class="pt-4 border-t border-slate-100 flex items-center justify-between mt-4">
                    <button onclick="prevScenario()" ${currentScenarioIndex === 0 ? 'disabled class="opacity-30 cursor-not-allowed px-4 py-2.5 bg-slate-200 text-slate-500 rounded-xl font-bold text-sm"' : 'class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 rounded-xl font-bold text-sm transition-all flex items-center space-x-1"'}>
                        <i class="fas fa-chevron-left text-xs"></i>
                        <span>이전 상황</span>
                    </button>

                    <button onclick="nextScenario()" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white rounded-xl font-bold text-sm shadow-md shadow-indigo-200 transition-all flex items-center space-x-2">
                        <span>${currentScenarioIndex === SCENARIOS.length - 1 ? '1번 상황으로 계속' : '다음 상황 계속'}</span>
                        <i class="fas fa-chevron-right text-xs"></i>
                    </button>
                </div>
            `;
        }

        // Helper to render sentence card with Study Tip Point
        function renderSentenceCard(item, idx, prefix) {
            const isMe = item.speaker === "나";
            const uniqueId = `${prefix}-${currentScenarioIndex}-${idx}`;

            return `
                <div class="p-3.5 rounded-2xl border transition-all ${isMe ? 'bg-indigo-50/70 border-indigo-200' : 'bg-slate-50 border-slate-200'}">
                    <div class="flex items-start justify-between">
                        <!-- Speaker Tag & Japanese Sentence (Clickable for TTS) -->
                        <div class="flex-1 cursor-pointer pr-2" onclick="speakJapanese('${item.jp.replace(/'/g, "\\'")}')">
                            <div class="flex items-center space-x-2 mb-1">
                                <span class="text-[11px] font-bold px-2 py-0.5 rounded-md ${isMe ? 'bg-indigo-600 text-white' : 'bg-slate-600 text-white'}">
                                    ${item.speaker}
                                </span>
                                <span class="text-xs text-indigo-500 font-medium hover:underline">
                                    <i class="fas fa-volume-up"></i> 자연어 발음 듣기
                                </span>
                            </div>
                            <div class="japanese-text font-bold text-base sm:text-lg text-slate-900 leading-snug">
                                ${item.jp}
                            </div>
                            <div class="text-xs text-indigo-700 font-medium mt-0.5">
                                [${item.reading}]
                            </div>
                            <div class="text-xs sm:text-sm text-slate-700 font-semibold mt-1">
                                ${item.kr}
                            </div>

                            <!-- Key Study Point Highlight -->
                            ${item.tip ? `
                                <div class="mt-2 text-[11px] text-amber-800 bg-amber-50/90 border border-amber-200 px-2.5 py-1 rounded-lg flex items-start space-x-1.5">
                                    <span class="font-bold text-amber-600 shrink-0">💡 꿀팁:</span>
                                    <span>${item.tip}</span>
                                </div>
                            ` : ''}
                        </div>

                        <!-- Mic Button for Pronunciation Practice -->
                        <button id="mic-btn-${uniqueId}" 
                                onclick="startSpeechRecognition('${item.jp.replace(/'/g, "\\'")}', '${uniqueId}')"
                                title="정확한 발음 테스트" 
                                class="w-10 h-10 rounded-full bg-white border border-slate-200 shadow-sm flex items-center justify-center text-slate-600 hover:text-indigo-600 hover:border-indigo-300 transition-all active:scale-90 shrink-0">
                            <i class="fas fa-microphone"></i>
                        </button>
                    </div>

                    <!-- Strict Evaluation Feedback Container -->
                    <div id="result-box-${uniqueId}" class="mt-2 hidden"></div>
                </div>
            `;
        }

        // 3. Review Screen
        function renderReviewScreen() {
            currentScreen = 'review';
            const headerActions = document.getElementById('header-actions');
            headerActions.classList.remove('hidden');
            headerActions.innerHTML = `
                <button onclick="renderHomeScreen()" class="px-3 py-1.5 bg-indigo-700 hover:bg-indigo-800 text-white rounded-lg text-xs font-semibold flex items-center space-x-1">
                    <i class="fas fa-home"></i>
                    <span>홈으로</span>
                </button>
            `;

            const content = document.getElementById('app-content');

            if (savedScenarioIds.length === 0) {
                content.innerHTML = `
                    <div class="flex-1 flex flex-col justify-center items-center text-center px-4 py-12">
                        <div class="w-20 h-20 bg-amber-50 rounded-full flex items-center justify-center text-amber-500 text-3xl mb-4">
                            <i class="far fa-bookmark"></i>
                        </div>
                        <h3 class="text-lg font-bold text-slate-800 mb-1">저장된 복습 항목이 없습니다</h3>
                        <p class="text-slate-500 text-xs mb-6">학습하기 모드에서 상단의 [저장] 버튼을 누르면<br>이곳에서 언제든 복습할 수 있습니다.</p>
                        <button onclick="startLearning()" class="py-2.5 px-5 bg-indigo-600 text-white text-sm font-bold rounded-xl shadow">
                            학습하러 가기
                        </button>
                    </div>
                `;
                return;
            }

            // Reverse order for recent-first sorting
            const savedScenarios = savedScenarioIds
                .map(id => SCENARIOS.find(s => s.id === id))
                .filter(Boolean)
                .reverse();

            content.innerHTML = `
                <div class="space-y-6">
                    <div class="flex items-center justify-between border-b pb-3">
                        <h3 class="font-bold text-slate-800 text-base sm:text-lg flex items-center space-x-2">
                            <i class="fas fa-bookmark text-amber-500"></i>
                            <span>복습 전용 목록 (최근 저장순)</span>
                        </h3>
                        <span class="text-xs text-slate-500 font-medium">총 ${savedScenarios.length}개 상황</span>
                    </div>

                    <!-- Cards List -->
                    <div class="space-y-6">
                        ${savedScenarios.map((scenario) => `
                            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                                <!-- Card Header -->
                                <div class="bg-slate-100 p-3 sm:p-4 flex items-center justify-between border-b border-slate-200">
                                    <div class="flex items-center space-x-2">
                                        <span class="text-xs font-bold px-2.5 py-0.5 rounded-full ${scenario.badgeColor}">${scenario.category}</span>
                                        <h4 class="font-bold text-slate-800 text-sm sm:text-base">${scenario.title}</h4>
                                    </div>
                                    <button onclick="deleteSavedScenario('${scenario.id}')" class="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-lg text-xs font-bold transition-all flex items-center space-x-1 border border-rose-200">
                                        <i class="fas fa-trash-alt text-[10px]"></i>
                                        <span>삭제</span>
                                    </button>
                                </div>

                                <!-- Dialogue List -->
                                <div class="p-3 sm:p-4 space-y-3.5">
                                    ${scenario.dialogue.map((item, idx) => renderSentenceCard(item, idx, `rev-${scenario.id}`)).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // --- CONTROLLER ACTIONS ---
        function startLearning() {
            currentScenarioIndex = 0;
            renderLearnScreen();
        }

        function nextScenario() {
            if (currentScenarioIndex < SCENARIOS.length - 1) {
                currentScenarioIndex++;
            } else {
                currentScenarioIndex = 0; // Loop back for infinite 20+ study
                showToast("모든 상황을 한 번 공부하셨습니다! 다시 1번부터 계속됩니다.", "fa-sync-alt");
            }
            renderLearnScreen();
        }

        function prevScenario() {
            if (currentScenarioIndex > 0) {
                currentScenarioIndex--;
                renderLearnScreen();
            }
        }

        function toggleSaveCurrentScenario() {
            const currentId = SCENARIOS[currentScenarioIndex].id;
            const index = savedScenarioIds.indexOf(currentId);

            if (index > -1) {
                savedScenarioIds.splice(index, 1);
                showToast("복습 목록에서 제거되었습니다.", "fa-minus-circle");
            } else {
                savedScenarioIds.push(currentId);
                showToast("복습 목록에 저장되었습니다!", "fa-check-circle");
            }
            renderLearnScreen();
        }

        function deleteSavedScenario(id) {
            savedScenarioIds = savedScenarioIds.filter(savedId => savedId !== id);
            showToast("복습 목록에서 삭제되었습니다.", "fa-trash-alt");
            renderReviewScreen();
        }

        function openReview() {
            renderReviewScreen();
        }

        // Toast Helper
        function showToast(message, iconClass = "fa-info-circle") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            const toastIcon = document.getElementById('toast-icon');

            toastMsg.innerText = message;
            toastIcon.className = `fas ${iconClass} text-amber-400`;

            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');

            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        // Initialize App on window load
        window.onload = initApp;
    </script>
</body>
</html>
